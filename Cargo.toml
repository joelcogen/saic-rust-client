[package]
name = "saic-client"
version = "0.1.0"
edition = "2021"
description = "An asynchronous Rust client for the SAIC MG iSMART API"
readme = "README.md"
publish = false

[[example]]
name = "cli"
test = true

[dependencies]
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hex = "0.4"
hmac = "0.12"
md-5 = "0.10"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
url = "2"
zeroize = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }

[dev-dependencies]
dotenvy = "0.15.7"
tokio = { version = "1", features = ["macros", "rt", "time", "test-util"] }
